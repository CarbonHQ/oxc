name: CarbonHQ Oxfmt npm

permissions:
  contents: read

on:
  push:
    branches: [sql]
    tags: ["carbonhq-oxfmt-v*"]
    paths:
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "apps/oxfmt/**"
      - "npm/oxfmt/**"
      - "pnpm*"
      - ".github/workflows/release_carbonhq_oxfmt.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    if: github.repository == 'CarbonHQ/oxc'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm run build-napi-release --target x86_64-pc-windows-msvc

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm run build-napi-release --target aarch64-pc-windows-msvc

          - os: windows-latest
            target: i686-pc-windows-msvc
            build: pnpm run build-napi-release --target i686-pc-windows-msvc

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm run build-napi-release --target x86_64-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm run build-napi-release --target aarch64-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: pnpm run build-napi-release --target armv7-unknown-linux-gnueabihf --use-napi-cross

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm run build-napi-release --target x86_64-unknown-linux-musl -x

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm run build-napi-release --target aarch64-unknown-linux-musl -x

          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            build: pnpm run build-napi-release --target armv7-unknown-linux-musleabihf -x

          - os: macos-latest
            target: x86_64-apple-darwin
            build: pnpm run build-napi-release --target x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin
            build: pnpm run build-napi-release --target aarch64-apple-darwin

          - os: ubuntu-latest
            target: aarch64-linux-android
            build: pnpm run build-napi-release --target aarch64-linux-android

          - os: ubuntu-latest
            target: armv7-linux-androideabi
            build: pnpm run build-napi-release --target armv7-linux-androideabi

          - os: ubuntu-latest
            target: aarch64-unknown-linux-ohos
            build: pnpm run build-napi-release --target aarch64-unknown-linux-ohos

          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            build: pnpm run build-napi-release --target powerpc64le-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            build: |
              sudo apt-get update
              sudo apt-get install gcc-riscv64-linux-gnu g++-riscv64-linux-gnu -y
              export TARGET_CC=riscv64-linux-gnu-gcc
              export CXX=riscv64-linux-gnu-g++
              pnpm run build-napi-release --target riscv64gc-unknown-linux-gnu

          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            build: pnpm run build-napi-release --target riscv64gc-unknown-linux-musl -x

          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            build: export CFLAGS="-fuse-ld=lld" && pnpm run build-napi-release --target s390x-unknown-linux-gnu --use-napi-cross

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET_CC: ${{ !contains(matrix.target, 'pc-windows-msvc') && 'clang' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cross
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        if: contains(matrix.target, 'musl')
        with:
          version: 0.13.0
      - uses: Boshen/setup-ohos-sdk@edb865a89a712f1f15dbad932dfa9cfce849d95c # v1.0.0
        if: contains(matrix.target, 'ohos')
      - run: rustup target add ${{ matrix.target }}
      - name: Build native binding
        working-directory: apps/oxfmt
        run: ${{ matrix.build }}
      - name: Test the Linux binding
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          pnpm --filter oxfmt-app build-js
          env -u NO_COLOR pnpm --filter oxfmt-app test --maxWorkers=1 --maxConcurrency=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carbonhq-oxfmt-binding-${{ matrix.target }}
          path: apps/oxfmt/src-js/*.node
          if-no-files-found: error

  build-freebsd:
    if: github.repository == 'CarbonHQ/oxc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - run: rustup target add x86_64-unknown-freebsd
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.15.2"
      - uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: rust-cross/cargo-zigbuild
      - working-directory: apps/oxfmt
        run: pnpm run build-napi-release --target x86_64-unknown-freebsd -x
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carbonhq-oxfmt-binding-x86_64-unknown-freebsd
          path: apps/oxfmt/src-js/*.node
          if-no-files-found: error

  package:
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: carbonhq-oxfmt-binding-*
      - run: pnpm --filter oxfmt-app build-js
      - name: Pack scoped packages and verify all declared targets
        run: node apps/oxfmt/scripts/prepare-carbonhq-release.mjs
      - name: Test installation from tarballs
        run: node apps/oxfmt/scripts/smoke-carbonhq-release.mjs target/carbonhq-npm @carbonhq/oxfmt-binding-linux-x64-gnu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carbonhq-oxfmt-npm
          path: target/carbonhq-npm/tarballs/
          if-no-files-found: error

  publish:
    needs: package
    if: github.repository == 'CarbonHQ/oxc' && startsWith(github.ref, 'refs/tags/carbonhq-oxfmt-v')
    runs-on: ubuntu-latest
    environment: carbonhq-npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: carbonhq-oxfmt-npm
          path: npm-tarballs
      - name: Verify release tag
        run: |
          node --input-type=module -e 'import p from "./npm/oxfmt/package.json" with {type:"json"}; if (process.env.GITHUB_REF_NAME !== `carbonhq-oxfmt-v${p.version}`) process.exit(1)'
      - name: Publish bindings before the main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_package() {
            local tarball="$1" name version
            read -r name version < <(
              tar -xOf "$tarball" package/package.json |
                node -e 'const p=JSON.parse(require("node:fs").readFileSync(0,"utf8")); console.log(p.name,p.version)'
            )
            if [[ "$(npm view "${name}@${version}" version 2>/dev/null)" == "$version" ]]; then
              echo "${name}@${version} is already published; skipping."
              return
            fi
            npm publish "$tarball" --access public --tag sql --provenance
          }
          for tarball in npm-tarballs/bindings/*.tgz; do
            publish_package "$tarball"
          done
          for tarball in npm-tarballs/root/*.tgz; do
            publish_package "$tarball"
          done
